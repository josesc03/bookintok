name: Backend

on:
  push:
    branches: [main]
    paths: ["backend/**", "docker-compose.yml", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", "docker-compose.yml", ".github/workflows/backend.yml"]

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # Integration tests start PostgreSQL and MongoDB with Testcontainers (Docker is available on the runner)
      - name: Build and run tests
        run: ./gradlew build --console=plain

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: backend/*/build/reports/tests/

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: |
          docker build -f backend/api/Dockerfile -t bookintok-api backend
          docker build -f backend/chat-service/Dockerfile -t bookintok-chat backend
