name: Android

on:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["frontend/**", ".github/workflows/android.yml"]

permissions:
  contents: read

jobs:
  build:
    name: Test and build APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # Unit tests run on the JVM: Room with Robolectric, network with Ktor's MockEngine
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: bookintok-debug-apk
          path: frontend/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: frontend/app/build/reports/tests/
