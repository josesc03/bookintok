    <path d="M50 50 C43 44 32 41 20 42 Q16 42.3 16 46 L16 78 Q16 81.5 20 81.2 C32 80.5 43 83 50 89 Z"/>
    <path d="M50 50 C57 44 68 41 80 42 Q84 42.3 84 46 L84 78 Q84 81.5 80 81.2 C68 80.5 57 83 50 89 Z"/>
